// ============ REPORTS ============
function printReport(type) {
  const orders = state.orders.filter(o => o.status !== "cancelled");
  const now = new Date().toLocaleString();
  const R = (label, value) => `<div class="item"><span class="name">${label}</span><span class="amt">${value}</span></div>`;
  let body = "";

  if (type === "products") {
    const productMap = {};
    orders.forEach(o => { (o.items||[]).forEach(i => {
      const key = i.productId + (i.variantId?"|"+i.variantId:"");
      if (!productMap[key]) productMap[key] = { name: i.name + (i.variantLabel?" ("+i.variantLabel+")":""), qty: 0, revenue: 0 };
      productMap[key].qty += i.qty; productMap[key].revenue += i.price * i.qty;
    }); });
    const list = Object.values(productMap).sort((a,b) => b.revenue - a.revenue);
    const totalRev = list.reduce((s,p) => s + p.revenue, 0);
    const totalQty = list.reduce((s,p) => s + p.qty, 0);
    body = `<div class="center bold head">${state.businessName||'KafoPOS'}</div>
      <div class="center sub">${state.outletName||''}</div>
      <div class="center sub">*** TOP PRODUCTS REPORT ***</div>
      <div class="line"></div>
      <div class="meta">Printed: ${now}</div>
      <div class="meta">Total Orders: ${orders.length}</div>
      <div class="line-strong"></div>
      <div class="item bold" style="font-size:11px;color:#444"><span class="name">#  Product</span><span>Qty</span><span class="amt">Revenue</span></div>
      <div class="line"></div>`;
    if (!list.length) { body += `<div class="center sub mt">No product data yet.</div>`; }
    list.forEach((p,i) => { body += `<div class="item"><span class="name">${i+1}. ${p.name}</span><span>${p.qty}</span><span class="amt">${fmtMoney(p.revenue)}</span></div>`; });
    body += `<div class="line-strong"></div>`;
    body += R("Products Sold", list.length);
    body += R("Total Qty Sold", totalQty);
    body += `<div class="item bold total-row"><span>TOTAL REVENUE</span><span class="amt">${fmtMoney(totalRev)}</span></div>`;
  }

  else if (type === "categories") {
    const catMap = {};
    orders.forEach(o => { (o.items||[]).forEach(i => {
      const prod = PRODUCTS.find(p => p.id === i.productId);
      const catId = prod ? prod.categoryId : "other";
      const cat = CATEGORIES.find(c => c.id === catId);
      const catName = cat ? cat.name : "Other";
      if (!catMap[catId]) catMap[catId] = { name: catName, qty: 0, revenue: 0, orders: new Set(), products: new Set() };
      catMap[catId].qty += i.qty; catMap[catId].revenue += i.price * i.qty;
      catMap[catId].orders.add(o.id); catMap[catId].products.add(i.productId);
    }); });
    const list = Object.values(catMap).sort((a,b) => b.revenue - a.revenue);
    const totalRev = list.reduce((s,c) => s + c.revenue, 0);
    const totalQty = list.reduce((s,c) => s + c.qty, 0);
    body = `<div class="center bold head">${state.businessName||'KafoPOS'}</div>
      <div class="center sub">${state.outletName||''}</div>
      <div class="center sub">*** CATEGORY BREAKDOWN ***</div>
      <div class="line"></div>
      <div class="meta">Printed: ${now}</div>
      <div class="meta">Total Orders: ${orders.length}</div>
      <div class="line-strong"></div>
      <div class="item bold" style="font-size:11px;color:#444"><span class="name">#  Category</span><span>Items</span><span class="amt">Revenue</span></div>
      <div class="line"></div>`;
    if (!list.length) { body += `<div class="center sub mt">No category data yet.</div>`; }
    list.forEach((c,i) => { body += `<div class="item"><span class="name">${i+1}. ${c.name}</span><span>${c.qty}</span><span class="amt">${fmtMoney(c.revenue)}</span></div>`; });
    body += `<div class="line-strong"></div>`;
    body += R("Categories", list.length);
    body += R("Total Items Sold", totalQty);
    body += `<div class="item bold total-row"><span>TOTAL REVENUE</span><span class="amt">${fmtMoney(totalRev)}</span></div>`;
  }

  const html = `<html><head><title>Report — ${state.businessName||'KafoPOS'}</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;font-family:monospace;font-size:12px}
      body{padding:14px;max-width:300px;margin:0 auto;color:#000}
      .center{text-align:center}.bold{font-weight:bold}.right{text-align:right}.mt{margin-top:8px}
      .line{border-top:1px dashed #000;margin:6px 0}
      .line-strong{border-top:2px solid #000;margin:6px 0}
      .item{display:flex;justify-content:space-between;padding:3px 0;align-items:flex-start;gap:8px}
      .item .name{flex:1}.item .amt{white-space:nowrap}
      .head{font-size:18px;font-weight:bold}.sub{font-size:10px;color:#444}
      .meta{font-size:10px;color:#444;margin:2px 0}
      .total-row{font-size:14px;font-weight:bold}
      @media print{body{margin:0;padding:8px}}
    </style></head><body>
    ${body}
    <div class="line"></div>
    <div class="center sub">Powered by ${state.businessName||'KafoPOS'}</div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`;
  const w = window.open("","_blank","width=380,height=680");
  if (w) { w.document.write(html); w.document.close(); }
}

function printDashboard(type) {
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  let rangeStart, rangeEnd, periodLabel;
  if (dashPeriod === "custom" && dashCustomDate) {
    const parts = dashCustomDate.split("-");
    const cd = new Date(+parts[0], +parts[1]-1, +parts[2]);
    rangeStart = cd.getTime(); rangeEnd = rangeStart + 86400000;
    periodLabel = cd.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  } else if (dashPeriod === "weekly") {
    rangeStart = weekStart; rangeEnd = weekStart + 7 * 86400000; periodLabel = "This Week";
  } else if (dashPeriod === "monthly") {
    rangeStart = monthStart; rangeEnd = new Date(now.getFullYear(), now.getMonth()+1, 1).getTime(); periodLabel = "This Month";
  } else {
    rangeStart = todayStart; rangeEnd = todayStart + 86400000; periodLabel = "Today";
  }
  const orders = state.orders.filter(o => o.status !== "cancelled" && o.createdAt >= rangeStart && o.createdAt < rangeEnd);
  const totalSales = orders.reduce((s,o) => s + o.total, 0);
  const printTime = new Date().toLocaleString();
  const R = (label, value) => `<div class="item"><span class="name">${label}</span><span class="amt">${value}</span></div>`;
  let body = "";

  if (type === "products") {
    const prodCounts = {};
    orders.forEach(o => o.items.forEach(i => {
      if(!prodCounts[i.productId]) prodCounts[i.productId] = { name: i.name, qty: 0, revenue: 0 };
      prodCounts[i.productId].qty += i.qty;
      prodCounts[i.productId].revenue += i.price * i.qty;
    }));
    const list = Object.values(prodCounts).sort((a,b) => b.revenue - a.revenue);
    const totalRev = list.reduce((s,p) => s + p.revenue, 0);
    const totalQty = list.reduce((s,p) => s + p.qty, 0);
    body = `<div class="center bold head">${state.businessName||'KafoPOS'}</div>
      <div class="center sub">${state.outletName||''}</div>
      <div class="center sub">*** TOP PRODUCTS ***</div>
      <div class="line"></div>
      <div class="meta">Period: ${periodLabel}</div>
      <div class="meta">Printed: ${printTime}</div>
      <div class="line-strong"></div>
      <div class="item bold" style="font-size:11px;color:#444"><span class="name">#  Product</span><span>Qty</span><span class="amt">Revenue</span></div>
      <div class="line"></div>`;
    if (!list.length) body += `<div class="center sub mt">No sales data for this period.</div>`;
    list.forEach((p,i) => { body += `<div class="item"><span class="name">${i+1}. ${p.name}</span><span>${p.qty}</span><span class="amt">${fmtMoney(p.revenue)}</span></div>`; });
    body += `<div class="line-strong"></div>`;
    body += R("Products Sold", list.length);
    body += R("Total Qty Sold", totalQty);
    body += R("Total Orders", orders.length);
    body += `<div class="item bold total-row"><span>TOTAL REVENUE</span><span class="amt">${fmtMoney(totalRev)}</span></div>`;
  }

  else if (type === "categories") {
    const catBreakdown = {};
    orders.forEach(o => o.items.forEach(i => {
      const c = CATEGORIES.find(c => c.id === i.categoryId);
      const catName = c ? c.name : "Other";
      if(!catBreakdown[catName]) catBreakdown[catName] = { qty: 0, revenue: 0 };
      catBreakdown[catName].qty += i.qty;
      catBreakdown[catName].revenue += i.price * i.qty;
    }));
    const list = Object.entries(catBreakdown).sort((a,b) => b[1].revenue - a[1].revenue);
    const totalRev = list.reduce((s,[,d]) => s + d.revenue, 0);
    const totalQty = list.reduce((s,[,d]) => s + d.qty, 0);
    body = `<div class="center bold head">${state.businessName||'KafoPOS'}</div>
      <div class="center sub">${state.outletName||''}</div>
      <div class="center sub">*** CATEGORY BREAKDOWN ***</div>
      <div class="line"></div>
      <div class="meta">Period: ${periodLabel}</div>
      <div class="meta">Printed: ${printTime}</div>
      <div class="line-strong"></div>
      <div class="item bold" style="font-size:11px;color:#444"><span class="name">#  Category</span><span>Items</span><span class="amt">Revenue</span></div>
      <div class="line"></div>`;
    if (!list.length) body += `<div class="center sub mt">No category data for this period.</div>`;
    list.forEach(([cat, d], i) => { body += `<div class="item"><span class="name">${i+1}. ${cat}</span><span>${d.qty}</span><span class="amt">${fmtMoney(d.revenue)}</span></div>`; });
    body += `<div class="line-strong"></div>`;
    body += R("Categories", list.length);
    body += R("Total Items Sold", totalQty);
    body += R("Total Orders", orders.length);
    body += `<div class="item bold total-row"><span>TOTAL REVENUE</span><span class="amt">${fmtMoney(totalRev)}</span></div>`;
  }

  else if (type === "expenses") {
    const expenses = state.expenses.filter(e => e.date ? (new Date(e.date).getTime() >= rangeStart && new Date(e.date).getTime() < rangeEnd) : false);
    const totalExp = expenses.reduce((s,e) => s + e.amount, 0);
    body = `<div class="center bold head">${state.businessName||'KafoPOS'}</div>
      <div class="center sub">${state.outletName||''}</div>
      <div class="center sub">*** EXPENSES ***</div>
      <div class="line"></div>
      <div class="meta">Period: ${periodLabel}</div>
      <div class="meta">Printed: ${printTime}</div>
      <div class="line-strong"></div>
      <div class="item bold" style="font-size:11px;color:#444"><span class="name">Description</span><span>Amount</span></div>
      <div class="line"></div>`;
    if (!expenses.length) body += `<div class="center sub mt">No expenses recorded for this period.</div>`;
    expenses.slice().reverse().forEach(e => {
      const dt = e.date ? new Date(e.date).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "";
      body += `<div class="item"><span class="name">${dt} ${e.description||e.category||"Expense"}</span><span class="amt">-${fmtMoney(e.amount)}</span></div>`;
    });
    body += `<div class="line-strong"></div>`;
    body += R("Total Sales", fmtMoney(totalSales));
    body += R("Total Expenses", "-" + fmtMoney(totalExp));
    body += `<div class="item bold total-row"><span>NET PROFIT</span><span class="amt">${fmtMoney(totalSales - totalExp)}</span></div>`;
  }

  const html = `<html><head><title>Report — ${state.businessName||'KafoPOS'}</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;font-family:monospace;font-size:12px}
      body{padding:14px;max-width:300px;margin:0 auto;color:#000}
      .center{text-align:center}.bold{font-weight:bold}.right{text-align:right}.mt{margin-top:8px}
      .line{border-top:1px dashed #000;margin:6px 0}
      .line-strong{border-top:2px solid #000;margin:6px 0}
      .item{display:flex;justify-content:space-between;padding:3px 0;align-items:flex-start;gap:8px}
      .item .name{flex:1}.item .amt{white-space:nowrap}
      .head{font-size:18px;font-weight:bold}.sub{font-size:10px;color:#444}
      .meta{font-size:10px;color:#444;margin:2px 0}
      .total-row{font-size:14px;font-weight:bold}
      @media print{body{margin:0;padding:8px}}
    </style></head><body>
    ${body}
    <div class="line"></div>
    <div class="center sub">Powered by ${state.businessName||'KafoPOS'}</div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`;
  const w = window.open("","_blank","width=380,height=680");
  if (w) { w.document.write(html); w.document.close(); }
}

function renderReports() {

  const expenses = state.expenses.reduce((s,e)=>s+e.amount,0);
  const profit = revenue - expenses - tax;

  // ---- CUSTOMER REPORT DATA ----
  const customerMap = {};

    customerMap[cname].orders++;
    customerMap[cname].totalSpent += o.total || 0;
    customerMap[cname].items += o.items.reduce((s,i)=>s+i.qty,0);
    if (o.createdAt > customerMap[cname].lastOrder) customerMap[cname].lastOrder = o.createdAt;
  });
  const customerList = Object.values(customerMap).sort((a,b)=>b.totalSpent-a.totalSpent);

  // ---- PRODUCT REPORT DATA ----

  orders.forEach(o => {
    (o.items||[]).forEach(i => {
      const key = i.productId + (i.variantId?"|"+i.variantId:"");
      if (!productMap[key]) productMap[key] = { productId: i.productId, variantId: i.variantId||null, name: i.name + (i.variantLabel?" ("+i.variantLabel+")":""), qty: 0, revenue: 0, orders: 0 };

function addKitchenPrinter() {
  const nameInput = document.getElementById("new-kitchen-name");
  const name = nameInput ? nameInput.value.trim() : "";
  if (!name) { alert("Please enter a station name."); return; }
  const iconBtn = document.querySelector('#kitchen-icon-picker button[data-selected="1"]') || document.querySelector('#kitchen-icon-picker button');
  const colorBtn = document.querySelector('#kitchen-color-picker button[data-selected="1"]') || document.querySelector('#kitchen-color-picker button');
  const icon = iconBtn ? iconBtn.dataset.icon : "🍳";
  const color = colorBtn ? colorBtn.dataset.color : "#f59e0b";
  const id = "kit-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/-+$/, "") + "-" + Date.now();
  if (KITCHENS.find(k => k.name.toLowerCase() === name.toLowerCase())) { alert("A kitchen station with this name already exists."); return; }
  KITCHENS.push({ id, name, icon, color });
  showAddKitchenForm = false;
  saveState(); render();
}

function removeKitchenPrinter(kitchenId) {
  const kitchen = KITCHENS.find(k => k.id === kitchenId);
  if (!kitchen) return;
  const cats = CATEGORIES.filter(c => (c.kitchenId || "main") === kitchenId);
  const fallbackId = KITCHENS.find(k => k.id !== kitchenId)?.id || "main";
  if (cats.length > 0) {
    if (!confirm(`Remove "${kitchen.name}"?\n\n${cats.length} categor${cats.length===1?'y':'ies'} assigned to this station will be moved to "${KITCHENS.find(k=>k.id===fallbackId)?.name || "Main Kitchen"}".`)) return;
    cats.forEach(c => { c.kitchenId = fallbackId; });
  } else {
    if (!confirm(`Remove "${kitchen.name}"?`)) return;
  }
  KITCHENS = KITCHENS.filter(k => k.id !== kitchenId);
  saveState(); render();
}

function handleProductImageFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { newProductImage = e.target.result; render(); };
  reader.readAsDataURL(file);
}

function handleProductImageDrop(event) {
  const file = event.dataTransfer.files[0];
  if (file && file.type.startsWith("image/")) { handleProductImageFile(file); }
}

function addProduct() {
  const name = (document.getElementById("new-prod-name")?.value || "").trim();
  const brand = (document.getElementById("new-prod-brand")?.value || "").trim();
  const categoryId = document.getElementById("new-prod-cat")?.value || "";
  const stock = parseInt(document.getElementById("new-prod-stock")?.value) || 100;
  const sku = (document.getElementById("new-prod-sku")?.value || "").trim();
  const desc = (document.getElementById("new-prod-desc")?.value || "").trim();

  if (!name) { alert("Please enter a product title."); return; }
  if (!categoryId) { alert("Please select a category."); return; }

  // Build variants if enabled
  let variants = undefined;
  let price = 0;
  if (newProductVariants.length > 0) {
    const valid = newProductVariants.filter(v => v.label.trim() && v.price > 0);
    if (valid.length === 0) { alert("Please add at least one size with a valid label and price."); return; }
    variants = valid.map((v, i) => ({ id: "var-" + Date.now() + "-" + i, label: v.label.trim(), price: v.price }));
    price = Math.min(...variants.map(v => v.price));
  } else {
    price = parseFloat(document.getElementById("new-prod-price")?.value) || 0;
    if (price <= 0) { alert("Please enter a valid price."); return; }
  }

  const id = "prod-" + Date.now();
  PRODUCTS.push({
    id, name, price, stock, categoryId,
    brand: brand || undefined,
    sku: sku || undefined,
    description: desc || undefined,
    imageUrl: newProductImage || undefined,
    variants: variants
  });

  showAddProductForm = false;
  newProductImage = null;
  newProductVariants = [];
  saveState(); render();
}



function toggleVariations() {
  if (newProductVariants.length > 0) {
    newProductVariants = [];
  } else {
    newProductVariants = [
      { label: "Small", price: 0 },
      { label: "Medium", price: 0 },
      { label: "Large", price: 0 }
    ];
  }
  render();
  // Re-focus: scroll dialog to bottom so user sees the new rows
  setTimeout(() => {
    const dialog = document.querySelector('.dialog-box');
    if (dialog) dialog.scrollTop = dialog.scrollHeight;
  }, 50);
}

function addVariantRow() {
  newProductVariants.push({ label: "", price: 0 });
  render();
  setTimeout(() => {
    const dialog = document.querySelector('.dialog-box');
    if (dialog) dialog.scrollTop = dialog.scrollHeight;
  }, 50);
}

function removeVariant(index) {
  if (newProductVariants.length <= 1) { alert("Product must have at least one size."); return; }
  newProductVariants.splice(index, 1);
  render();
}

function updateVariant(index, field, value) {
  if (newProductVariants[index]) {
    newProductVariants[index][field] = value;
  }
}

function updateProduct() {
  var p = PRODUCTS.find(function(x) { return x.id === editingProductId; });
  if (!p) return;
  var name = (document.getElementById("edit-prod-name") || {}).value || "";
  var catId = (document.getElementById("edit-prod-cat") || {}).value || "";
  if (!name.trim()) { alert("Product name cannot be empty."); return; }
  if (!catId) { alert("Please select a category."); return; }
  p.name = name.trim();
  p.categoryId = catId;
  if (p.variants && p.variants.length > 0) {
    for (var i = 0; i < p.variants.length; i++) {
      var lbl = (document.getElementById("edit-var-label-" + i) || {}).value || "";
      var pr = parseFloat((document.getElementById("edit-var-price-" + i) || {}).value) || 0;
      p.variants[i].label = lbl.trim();
      p.variants[i].price = pr;
    }
    p.price = Math.min.apply(null, p.variants.map(function(v) { return v.price; }));
  } else {
    p.price = parseFloat((document.getElementById("edit-prod-price") || {}).value) || p.price;
  }
  p.stock = parseInt((document.getElementById("edit-prod-stock") || {}).value) || 0;
  p.description = (document.getElementById("edit-prod-desc") || {}).value || "";
  editingProductId = null;
  saveState(); render();
}

function deleteProduct(productId) {
  if (!confirm("Are you sure you want to delete this product?")) return;
  var idx = PRODUCTS.findIndex(function(p) { return p.id === productId; });
  if (idx === -1) return;
  PRODUCTS.splice(idx, 1);
  saveState(); render();
}

function printCurrentCart() {
  if (state.cart.items.length === 0) return;
  const kitGroups = {};
  state.cart.items.forEach(i => {
    const kid = i.kitchenId || "main";
    if (!kitGroups[kid]) kitGroups[kid] = [];
    kitGroups[kid].push(i);
  });
  const totals = computeTotals();
  let html = `<html><head><title>New Order</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:monospace;font-size:12px}
    body{padding:12px;max-width:300px;margin:0 auto}
    .center{text-align:center}.bold{font-weight:bold}.mt{margin-top:8px}
    .line{border-top:1px dashed #000;margin:6px 0}.item{display:flex;justify-content:space-between;padding:2px 0}
    .kit-label{font-size:10px;font-weight:bold;padding:2px 6px;margin:4px 0;display:inline-block;border:1px solid #000}
    @media print{body{margin:0;padding:8px}}
</style></head><body>
    <div class="center bold" style="font-size:16px">${state.businessName}</div>
    <div class="center" style="font-size:10px">${state.outletName}</div>
    <div class="line"></div>
    <div>Customer: ${state.cart.customerName || "Walk-in"}${state.cart.tableLabel?' · Table '+state.cart.tableLabel:''}</div>
    <div class="line"></div>`;
  Object.entries(kitGroups).forEach(([kid, items]) => {
    const k = KITCHENS.find(kk => kk.id === kid) || KITCHENS[0];
    html += `<div class="kit-label">${k.icon} ${k.name.toUpperCase()}</div>`;
    items.forEach(i => {
      html += `<div class="item"><span>×${i.qty} ${i.name}${i.variantLabel?' ['+i.variantLabel+']':''}</span><span>${fmtMoney(i.price*i.qty)}</span></div>`;
    });
    html += `<div class="line"></div>`;

  html += `<div class="item"><span>Tax (${Math.round(state.taxRate*100)}%)</span><span>${fmtMoney(totals.tax)}</span></div>`;

// === PRA e-IMS INTEGRATION (in-browser, no backend) ==========
// ============================================================
// This entire integration runs in the browser. In a real deployment
// you'd swap submitToPRA's mock responder with a fetch() to your
// Node.js middleware (POST /api/invoice). Everything else stays.
// ============================================================

const PRA_STATE = {
  mode: 'sandbox',         // 'sandbox' | 'production' (both use mock here)
  praOnline: true,         // toggle to simulate PRA outage
  invoices: [],            // audit log (persisted to localStorage)
  seq: 1,
  workerStarted: false,
  // Seller identity — editable from the PRA e-IMS view ("Edit Seller Details" button).
  // In a real deployment these come from .env / middleware config; here they're
  // persisted to localStorage so the user can configure them without touching code.
  seller: {
    businessName: 'Extra Lounge',
    outletName: 'Extra Lounge — Coffee',
    registrationNumber: 'PRA-REG-DEMO-12345',
    ntn: '1234567-8',
    address: 'Riyadh, Saudi Arabia',
    posTerminalId: 'POS-01',
  },
};
const PRA_TAX_RATE = 0.05; // 5% sales tax on services

// Default seller (used when resetting to factory defaults from the edit modal)
const PRA_SELLER_DEFAULTS = {
  businessName: 'Extra Lounge',
  outletName: 'Extra Lounge — Coffee',
  registrationNumber: 'PRA-REG-DEMO-12345',
  ntn: '1234567-8',
  address: 'Riyadh, Saudi Arabia',
  posTerminalId: 'POS-01',
};

// ----- Persistence -----
const PRA_LS_KEY = 'kafopos_pra_state_v1';
function praSave() {
  try {
    localStorage.setItem(PRA_LS_KEY, JSON.stringify({
      mode: PRA_STATE.mode,
      praOnline: PRA_STATE.praOnline,
      invoices: PRA_STATE.invoices,
      seq: PRA_STATE.seq,
      seller: PRA_STATE.seller,
    }));
  } catch (e) { console.warn('PRA state save failed:', e); }
}
function praLoad() {
  try {
    const s = localStorage.getItem(PRA_LS_KEY);
    if (s) {
      const p = JSON.parse(s);
      PRA_STATE.mode = p.mode || 'sandbox';
      PRA_STATE.praOnline = p.praOnline !== false;
      PRA_STATE.invoices = p.invoices || [];
      PRA_STATE.seq = p.seq || 1;
      // Merge seller with defaults so new fields appear if the schema changes
      PRA_STATE.seller = { ...PRA_SELLER_DEFAULTS, ...(p.seller || {}) };
    }
  } catch (e) {}
}
praLoad();

// ----- Helpers -----
function praLocalRef(seq) {
  return `FB-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${String(seq).padStart(3,'0')}`;
}
function praQrUrl(payload, size) {
  size = size || 120;
  // Uses public qrserver.com API. In the real middleware, QR codes are
  // generated locally with the 'qrcode' npm package and embedded as base64.
  return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size +
         '&data=' + encodeURIComponent(payload) +
         '&ecc=H&color=000000&bgcolor=FFFFFF';
}
function praFmtMoney(v) { return fmtMoney(v); }
function praEscapeHtml(s) {
  return String(s == null ? '' : s)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}

// ============================================================
// MOCK PRA RESPONDER (in-browser)
// ------------------------------------------------------------
// In the real deployment, replace this function body with:
//
//   const res = await fetch('http://localhost:4000/api/invoice', {
//     method: 'POST',
//     headers: { 'Content-Type': 'application/json',
//                'Authorization': 'Bearer ' + PRA_API_KEY },
//     body: JSON.stringify(payload),
//   });
//   return await res.json();
//
// The middleware handles the real PRA HTTP call, queue, retry, etc.
// ============================================================
async function praSubmit(invoice) {
  // Simulate network latency 150-350ms
  await new Promise(r => setTimeout(r, 150 + Math.random() * 200));

  if (!PRA_STATE.praOnline) {
    const err = new Error('Network error: PRA e-IMS unreachable (simulated outage)');
    err.code = 'NETWORK_ERROR';
    throw err;
  }

  // Generate a PRA-style invoice number + QR payload
  const seq = String(Math.floor(Math.random() * 9000000) + 1000000);
  const prefix = PRA_STATE.mode === 'production' ? 'PRA' : 'PRA-SBX';
  const invoiceNumber = `PRA${PRA_STATE.mode === 'production' ? '' : '-SBX'}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${seq}`;

  const qrPayload = JSON.stringify({
    tin: PRA_STATE.seller.registrationNumber,
    invoice: invoiceNumber,
    datetime: invoice.invoiceDatetime,
    total: invoice.totals.total,
    tax: invoice.totals.tax,
    seller: PRA_STATE.seller.businessName,
    mode: PRA_STATE.mode,
  });

  return { ok: true, invoiceNumber, qrPayload, qrUrl: praQrUrl(qrPayload, 120) };
}

// ============================================================
// submitToPRA(order) — called from payOrder() when a sale finalizes
// Always resolves (never rejects). Stores result on order.pra.
// ============================================================
async function submitToPRA(o) {
  if (!o || !o.number) return { status: 'error', error: 'No order' };

  const totals = {
    subtotal: o.subtotal || 0,
    discount: o.discount || 0,
    fee: o.fee || 0,
    tip: o.tip || 0,
    tax: o.tax || 0,
    total: o.total || 0,
    currency: state.currency || 'PKR',
  };

  const items = (o.items || []).map(i => ({
    name: i.name + (i.variantLabel ? ' [' + i.variantLabel + ']' : ''),
    qty: i.qty,
    unitPrice: i.price,
    taxRate: state.taxRate || PRA_TAX_RATE,
    taxAmount: Math.round(i.price * i.qty * (state.taxRate || PRA_TAX_RATE) * 100) / 100,
    lineTotal: Math.round(i.price * i.qty * (1 + (state.taxRate || PRA_TAX_RATE)) * 100) / 100,
  }));

  const invoice = {
    id: PRA_STATE.seq++,
    localRef: o.number,
    invoiceDatetime: new Date(o.createdAt || Date.now()).toISOString(),
    posTerminalId: PRA_STATE.seller.posTerminalId,
    mode: PRA_STATE.mode,
    seller: { ...PRA_STATE.seller },
    buyer: (o.customerName && o.customerName !== 'Walk-in') ? { name: o.customerName } : null,
    items,
    totals,
    payment: {
      mode: o.paymentMethod || 'cash',
      amount: o.paid || totals.total,
      tendered: o.paid || totals.total,
      change: Math.max(0, (o.paid || 0) - totals.total),
    },
    issuedBy: o.staffName || null,
    status: 'queued',
    attempts: 0,
    praInvoiceNumber: null,
    praQrPayload: null,
    praQrUrl: null,
    lastError: null,
    nextAttemptAt: new Date().toISOString(),
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    events: [{ type: 'created', at: new Date().toISOString() }],
  };
  PRA_STATE.invoices.unshift(invoice);
  praSave();

  // Attempt synchronous submit
  invoice.attempts = 1;
  invoice.events.push({ type: 'attempt', attempt: 1, at: new Date().toISOString() });
  try {
    const result = await praSubmit(invoice);
    invoice.status = 'sent';
    invoice.praInvoiceNumber = result.invoiceNumber;
    invoice.praQrPayload = result.qrPayload;
    invoice.praQrUrl = result.qrUrl;
    invoice.lastError = null;
    invoice.nextAttemptAt = null;
    invoice.events.push({ type: 'success', attempt: 1, at: new Date().toISOString(), invoiceNumber: result.invoiceNumber });

    o.pra = {
      status: 'sent',
      localRef: invoice.localRef,
      invoiceNumber: invoice.praInvoiceNumber,
      qrUrl: invoice.praQrUrl,
      qrPayload: invoice.praQrPayload,
      mode: invoice.mode,
      syncedAt: Date.now(),
    };
  } catch (err) {
    invoice.status = 'queued';
    invoice.lastError = err.message;
    invoice.nextAttemptAt = new Date(Date.now() + 5000).toISOString();
    invoice.events.push({ type: 'retry_scheduled', attempt: 1, at: new Date().toISOString(), error: err.message, nextAttemptAt: invoice.nextAttemptAt });
    o.pra = { status: 'queued', localRef: invoice.localRef, mode: invoice.mode, queuedAt: Date.now() };
    schedulePRARetry(invoice);
  }
  invoice.updatedAt = new Date().toISOString();
  praSave();
  saveState();
  return o.pra;
}

// ============================================================
// Background retry worker (5s interval for demo; real middleware
// uses 30s → 6h exponential backoff)
// ============================================================
function schedulePRARetry(invoice) {
  const tryAgain = async () => {
    if (invoice.status !== 'queued') return;
    invoice.attempts += 1;
    invoice.lastAttemptAt = new Date().toISOString();
    invoice.events.push({ type: 'attempt', attempt: invoice.attempts, at: new Date().toISOString() });
    try {
      const result = await praSubmit(invoice);
      invoice.status = 'sent';
      invoice.praInvoiceNumber = result.invoiceNumber;
      invoice.praQrPayload = result.qrPayload;
      invoice.praQrUrl = result.qrUrl;
      invoice.lastError = null;
      invoice.nextAttemptAt = null;
      invoice.events.push({ type: 'success', attempt: invoice.attempts, at: new Date().toISOString(), invoiceNumber: result.invoiceNumber });

      // If this order is in state.orders, update its pra field
      const order = state.orders.find(o => o.number === invoice.localRef);
      if (order) {
        order.pra = {
          status: 'sent', localRef: invoice.localRef,
          invoiceNumber: invoice.praInvoiceNumber, qrUrl: invoice.praQrUrl,
          qrPayload: invoice.praQrPayload, mode: invoice.mode, syncedAt: Date.now(),
        };
        saveState();
      }
      console.log('PRA invoice synced after retry:', invoice.localRef, '→', invoice.praInvoiceNumber);
    } catch (err) {
      invoice.lastError = err.message;
      if (invoice.attempts >= 10) {
        invoice.status = 'failed';
        invoice.nextAttemptAt = null;
        invoice.events.push({ type: 'failed', attempt: invoice.attempts, at: new Date().toISOString(), error: err.message });
      } else {
        invoice.nextAttemptAt = new Date(Date.now() + 5000).toISOString();
        invoice.events.push({ type: 'retry_scheduled', attempt: invoice.attempts, at: new Date().toISOString(), error: err.message, nextAttemptAt: invoice.nextAttemptAt });
        setTimeout(tryAgain, 5000);
      }
    }
    invoice.updatedAt = new Date().toISOString();
    praSave();
    // Re-render PRA view if visible
    if (state.view === 'pra') render();
  };
  setTimeout(tryAgain, 5000);
}

function startPRAWorker() {
  if (PRA_STATE.workerStarted) return;
  PRA_STATE.workerStarted = true;
  // Every 10s, attempt any due queued invoices (in addition to per-invoice scheduled retries)
  setInterval(() => {
    const now = Date.now();
    const due = PRA_STATE.invoices.filter(i =>
      i.status === 'queued' &&
      i.nextAttemptAt &&
      new Date(i.nextAttemptAt).getTime() <= now
    );
    due.forEach(invoice => {
      // Clear nextAttemptAt so schedulePRARetry's tryAgain runs once
      const tryAgain = async () => {
        invoice.attempts += 1;
        invoice.lastAttemptAt = new Date().toISOString();
        invoice.events.push({ type: 'attempt', attempt: invoice.attempts, at: new Date().toISOString(), note: 'worker tick' });
        try {
          const result = await praSubmit(invoice);
          invoice.status = 'sent';
          invoice.praInvoiceNumber = result.invoiceNumber;
          invoice.praQrPayload = result.qrPayload;
          invoice.praQrUrl = result.qrUrl;
          invoice.lastError = null;
          invoice.nextAttemptAt = null;
          invoice.events.push({ type: 'success', attempt: invoice.attempts, at: new Date().toISOString(), invoiceNumber: result.invoiceNumber });
          const order = state.orders.find(o => o.number === invoice.localRef);
          if (order) {
            order.pra = { status: 'sent', localRef: invoice.localRef, invoiceNumber: invoice.praInvoiceNumber, qrUrl: invoice.praQrUrl, qrPayload: invoice.praQrPayload, mode: invoice.mode, syncedAt: Date.now() };
            saveState();
          }
        } catch (err) {
          invoice.lastError = err.message;
          if (invoice.attempts >= 10) {
            invoice.status = 'failed';
            invoice.nextAttemptAt = null;
          } else {
            invoice.nextAttemptAt = new Date(Date.now() + 5000).toISOString();
          }
        }
        invoice.updatedAt = new Date().toISOString();
        praSave();
        if (state.view === 'pra') render();
      };
      tryAgain();
    });
  }, 10000);
}

// PRA view action handlers
// ============================================================
function praToggleMode() {
  const next = PRA_STATE.mode === 'sandbox' ? 'production' : 'sandbox';
  if (next === 'production' && !confirm('Switch to PRODUCTION mode?\n\nIn this single-file demo, production still uses the mock PRA responder. In a real deployment, this would POST to your real PRA e-IMS endpoint using credentials from .env.')) return;
  PRA_STATE.mode = next;
  praSave();
  render();
}
function praToggleOnline() {
  PRA_STATE.praOnline = !PRA_STATE.praOnline;
  praSave();
  render();
}
async function praRetryOne(id) {
  const inv = PRA_STATE.invoices.find(i => i.id === id);
  if (!inv) return;
  inv.status = 'queued';
  inv.attempts += 1;
  inv.nextAttemptAt = new Date().toISOString();
  inv.events.push({ type: 'attempt', attempt: inv.attempts, at: new Date().toISOString(), note: 'manual retry' });
  praSave();
  render();
  try {
    const r = await praSubmit(inv);
    inv.status = 'sent';
    inv.praInvoiceNumber = r.invoiceNumber;
    inv.praQrPayload = r.qrPayload;
    inv.praQrUrl = r.qrUrl;
    inv.lastError = null;
    inv.nextAttemptAt = null;
    inv.events.push({ type: 'success', attempt: inv.attempts, at: new Date().toISOString(), invoiceNumber: r.invoiceNumber });
    const order = state.orders.find(o => o.number === inv.localRef);
    if (order) { order.pra = { status:'sent', localRef:inv.localRef, invoiceNumber:inv.praInvoiceNumber, qrUrl:inv.praQrUrl, qrPayload:inv.praQrPayload, mode:inv.mode, syncedAt:Date.now() }; saveState(); }
  } catch (err) {
    inv.lastError = err.message;
    if (inv.attempts >= 10) { inv.status = 'failed'; inv.nextAttemptAt = null; }
    else { inv.nextAttemptAt = new Date(Date.now() + 5000).toISOString(); schedulePRARetry(inv); }
  }
  inv.updatedAt = new Date().toISOString();
  praSave();
  render();
}
async function praRetryAll() {
  const queued = PRA_STATE.invoices.filter(i => i.status === 'queued' || i.status === 'failed');
  for (const inv of queued) {
    inv.status = 'queued';
    inv.attempts += 1;
    inv.nextAttemptAt = new Date().toISOString();
    praSave();
    try {
      const r = await praSubmit(inv);
      inv.status = 'sent';
      inv.praInvoiceNumber = r.invoiceNumber;
      inv.praQrPayload = r.qrPayload;
      inv.praQrUrl = r.qrUrl;
      inv.lastError = null;
      inv.nextAttemptAt = null;
      inv.events.push({ type: 'success', attempt: inv.attempts, at: new Date().toISOString(), invoiceNumber: r.invoiceNumber });
      const order = state.orders.find(o => o.number === inv.localRef);
      if (order) { order.pra = { status:'sent', localRef:inv.localRef, invoiceNumber:inv.praInvoiceNumber, qrUrl:inv.praQrUrl, qrPayload:inv.praQrPayload, mode:inv.mode, syncedAt:Date.now() }; saveState(); }
    } catch (err) {
      inv.lastError = err.message;
      if (inv.attempts >= 10) { inv.status = 'failed'; inv.nextAttemptAt = null; }

}
function praClearLog() {
  if (!confirm('Clear the PRA audit log? This cannot be undone.')) return;
  PRA_STATE.invoices = [];
  PRA_STATE.seq = 1;
  praSave();
  render();
}
function praExportCsv() {
  const rows = [['local_ref','invoice_datetime','pra_invoice_number','status','subtotal','discount','fee','tip','tax','total','payment_mode','mode','attempts','last_error','created_at']];
  PRA_STATE.invoices.forEach(i => rows.push([
    i.localRef, i.invoiceDatetime, i.praInvoiceNumber || '', i.status,
    i.totals.subtotal, i.totals.discount, i.totals.fee, i.totals.tip,
    i.totals.tax, i.totals.total, i.payment.mode, i.mode, i.attempts,
    i.lastError || '', i.createdAt,
  ]));
  const csv = rows.map(r => r.map(c => {
    const s = String(c == null ? '' : c);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pra-invoices-' + Date.now() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function praOpenSellerModal() {
  const modal = document.getElementById('pra-seller-modal');
  if (!modal) return;
  // Pre-fill with current values
  const s = PRA_STATE.seller;
  document.getElementById('pra-sl-businessName').value = s.businessName || '';
  document.getElementById('pra-sl-outletName').value = s.outletName || '';
  document.getElementById('pra-sl-registrationNumber').value = s.registrationNumber || '';
  document.getElementById('pra-sl-ntn').value = s.ntn || '';
  document.getElementById('pra-sl-posTerminalId').value = s.posTerminalId || '';
  document.getElementById('pra-sl-address').value = s.address || '';
  modal.style.display = 'flex';
}

function praCloseSellerModal() {
  const modal = document.getElementById('pra-seller-modal');
  if (modal) modal.style.display = 'none';
}

function praSaveSeller() {
  const businessName = document.getElementById('pra-sl-businessName').value.trim();
  const registrationNumber = document.getElementById('pra-sl-registrationNumber').value.trim();
  const ntn = document.getElementById('pra-sl-ntn').value.trim();
  if (!businessName) { alert('Business Name is required.'); return; }
  if (!registrationNumber) { alert('PRA Registration Number is required.\n\nIf you don\'t have one yet, use a placeholder like PRA-REG-PENDING and update it once PRAL issues your real number.'); return; }
  if (!ntn) { alert('NTN is required.'); return; }

  PRA_STATE.seller = {
    businessName,
    outletName: document.getElementById('pra-sl-outletName').value.trim(),
    registrationNumber,
    ntn,
    address: document.getElementById('pra-sl-address').value.trim(),
    posTerminalId: document.getElementById('pra-sl-posTerminalId').value.trim() || 'POS-01',
  };
  praSave();
  praCloseSellerModal();
  render();
  console.log('PRA seller details updated:', PRA_STATE.seller);
}

function praResetSellerDefaults() {
  if (!confirm('Reset all seller details to factory defaults? This will overwrite your current values.')) return;
  PRA_STATE.seller = { ...PRA_SELLER_DEFAULTS };
  praSave();
  praOpenSellerModal(); // re-populate with defaults
  render();
}

// Close modal on outside click or Escape
document.addEventListener('click', (e) => {
  const modal = document.getElementById('pra-seller-modal');
  if (modal && e.target === modal) praCloseSellerModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') praCloseSellerModal();
});
